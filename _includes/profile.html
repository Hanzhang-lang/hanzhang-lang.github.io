{% assign is_zh = false %}
{% if page.lang == "zh-CN" %}{% assign is_zh = true %}{% endif %}
<aside class="profile" aria-label="{% if is_zh %}个人资料{% else %}Profile{% endif %}">
  <img class="profile-avatar" src="{{ site.author.avatar }}" alt="Han Zhang">
  <h2>{% if is_zh %}张涵{% else %}Han Zhang{% endif %}</h2>
  <p class="profile-bio">{{ site.author.bio }}</p>
  <p class="profile-location">{{ site.author.location }}</p>
  <div class="profile-links">
    <a href="mailto:{{ site.author.email }}" aria-label="Email {{ site.author.email }}" title="{{ site.author.email }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v.5l9 6 9-6V6H3Zm18 12V8.9l-8.4 5.6a1 1 0 0 1-1.2 0L3 8.9V18h18Z"/></svg>
    </a>
    <a href="https://github.com/{{ site.author.github }}" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.5 11.5 0 0 0 8.4 23c.6.1.8-.3.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.3.1 2 1.3 2 1.3 1.1 2 3 1.4 3.7 1 .1-.8.4-1.4.8-1.7-2.7-.3-5.6-1.4-5.6-6a4.7 4.7 0 0 1 1.3-3.3 4.4 4.4 0 0 1 .1-3.2s1-.3 3.4 1.3a11.8 11.8 0 0 1 6.2 0c2.4-1.6 3.4-1.3 3.4-1.3a4.4 4.4 0 0 1 .1 3.2 4.7 4.7 0 0 1 1.3 3.3c0 4.6-2.9 5.7-5.6 6 .5.4.8 1.1.8 2.2v3.4c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/></svg>
    </a>
    <a href="{{ site.author.googlescholar }}" aria-label="Google Scholar" title="Google Scholar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 8l11 6 9-4.9V16h2V8L12 2Zm-6.5 9.7V17L12 22l6.5-5v-5.3L12 15l-6.5-3.3Z"/></svg>
    </a>
  </div>
  {% include personal-note.html %}
</aside>
