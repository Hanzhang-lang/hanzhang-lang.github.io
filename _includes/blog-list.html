<div class="blog-list">
  {% for post in site.data.legacy_posts %}
    <article class="blog-item">
      <time datetime="{{ post.date }}">{{ post.date }}</time>
      <div>
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p>{{ post.excerpt }}</p>
        {% if post.category %}<span class="blog-category">{{ post.category }}</span>{% endif %}
      </div>
    </article>
  {% endfor %}
</div>
